# worker/fly.toml
# 41차-15: fly.io 도쿄(nrt) 한국 서버 배포 설정
# Railway Worker 대체 — Naver SmartPlace 로그인 IP 차단 우회

app = "localution-worker-kr"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WORKER_CONCURRENCY = "2"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
