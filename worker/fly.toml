app = "localution-worker-kr"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WORKER_CONCURRENCY = "2"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  auto_stop_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
