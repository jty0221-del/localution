<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로컬루션 - 오프라인</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background-color: #F8FAFB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 48px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      background-color: #F0F4FF;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1A202C;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: #718096;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .button {
      background-color: #3182F6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .button:hover {
      background-color: #2563EB;
      box-shadow: 0 4px 12px rgba(49, 130, 246, 0.3);
    }

    .button:active {
      transform: scale(0.98);
    }

    .status {
      font-size: 12px;
      color: #A0AEC0;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4C13.06 4 4 13.06 4 24C4 34.94 13.06 44 24 44C34.94 44 44 34.94 44 24C44 13.06 34.94 4 24 4ZM24 40C15.18 40 8 32.82 8 24C8 15.18 15.18 8 24 8C32.82 8 40 15.18 40 24C40 32.82 32.82 40 24 40ZM24.5 12H23.5V25L35 35.5L35.7 34.8L24.5 24.6V12Z" fill="#3182F6"/>
      </svg>
    </div>

    <h1>오프라인 상태입니다</h1>
    <p>인터넷 연결이 없습니다. 연결을 확인한 후 다시 시도해주세요.</p>

    <button class="button" onclick="handleRetry()">다시 시도</button>

    <div class="status">
      <span id="status-text">연결 대기 중...</span>
    </div>
  </div>

  <script>
    // Check for connection status
    function checkConnection() {
      fetch('/manifest.json', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          // Connection restored
          window.location.href = '/';
        })
        .catch(() => {
          // Still offline
          updateStatusText();
        });
    }

    function handleRetry() {
      const button = document.querySelector('.button');
      button.disabled = true;
      button.textContent = '시도 중...';

      checkConnection();

      // Re-enable after 2 seconds
      setTimeout(() => {
        button.disabled = false;
        button.textContent = '다시 시도';
      }, 2000);
    }

    function updateStatusText() {
      const statusText = document.getElementById('status-text');
      const time = new Date().toLocaleTimeString('ko-KR', {
        hour: '2-digit',
        minute: '2-digit',
      });
      statusText.textContent = `마지막 확인: ${time}`;
    }

    // Monitor online/offline status
    window.addEventListener('online', () => {
      window.location.href = '/';
    });

    window.addEventListener('offline', () => {
      updateStatusText();
    });

    // Initial status update
    updateStatusText();

    // Check connection every 5 seconds
    setInterval(checkConnection, 5000);
  </script>
</body>
</html>
